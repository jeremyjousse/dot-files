[env]
_.path = ['./node_modules/.bin']

[tools]

"github:anomalyco/opencode" = "latest"

deno = 'latest'
node = 'lts'
"npm:@github/copilot" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

go = 'latest'

python = 'latest'

java = 'temurin-25'
maven = 'latest'

rust = { version = "latest", toolchain = "stable", components = ["clippy", "rustfmt"] }
"cargo:tauri-cli" = 'latest'

fnox = "latest"

[plugins]

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
experimental = true
