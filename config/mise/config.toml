[env]
_.path = ['./node_modules/.bin']

[tools]

node = 'lts'
"npm:@github/copilot" = "latest"
"cargo:https://github.com/googleworkspace/cli" = { version = "latest", locked = true }
"npm:@earendil-works/pi-coding-agent" = "latest"

go = 'latest'

python = 'latest'

java = 'temurin-25'
maven = 'latest'

rust = { version = "latest", toolchain = "stable", components = ["clippy", "rustfmt"] }
"cargo:tauri-cli" = 'latest'

fnox = "latest"
opencode = "latest"

[plugins]

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
experimental = true
